; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; A plain `pio run`/upload with no -e builds every environment below it,
; including [env:native] -- which produces no firmware on purpose (see its
; own comment) and fails to link for that exact reason. Pinning the default
; here is what keeps upload from ever touching it.
default_envs = esp32-s3

[env:esp32-s3]
platform                = espressif32
board                   = esp32-s3-devkitc-1
framework               = espidf
monitor_speed           = 921600
upload_speed            = 921600
board_build.f_cpu       = 240000000L
monitor_filters         = esp32_exception_decoder

; OTA — the robot's own OTAUpdater (lib/OTAUpdater) is a plain HTTP server
; (POST /update with the raw .bin body), not the ArduinoOTA/espota wire
; protocol, so upload_protocol must stay "custom" with an explicit curl
; command rather than "espota" (which sends a UDP invitation on :3232 that
; nothing on the robot is listening for — that's the "No response from the
; ESP" espota used to fail with here).
; The password below must match settings.conf's [ota] ota_password on the
; robot (default "657585", see lib/RobotSettings/RobotSettings.h) — this
; file can't read that at upload time, so keep the two in sync by hand.
upload_protocol         = esptool
;upload_port             = ballyrobot.local
;upload_command          = curl -sS --fail --max-time 180 -H "X-OTA-Password: 657585" --data-binary @"$SOURCE" "http://$UPLOAD_PORT/update"

; memory configuration
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = partitions.csv
board_build.arduino.memory_type = qspi_opi

; external libraries
;
; BTP is NOT here -- it is an ESP-IDF component (components/btp/), because a
; lib_deps library under `framework = espidf` is built outside the IDF CMake
; graph and never sees the mbedtls/PSA headers BTP/src/aead.cpp needs, so
; RadioSeal's btp::aead_* calls come out undefined at link time. See
; components/btp/CMakeLists.txt. [env:native] still builds BTP from the same
; sibling checkout via symlink://../BTP below.
lib_deps =
    ; DEV (terminal-to-robot work): TinyShell now carries ShellLineEditor, the
    ; server-side line editor TerminalResponder uses to give TraceView's
    ; terminal a shell on this robot. Points at the sibling checkout until it
    ; is pushed + tagged; then repin to
    ; https://github.com/AlisonTristao/TinyShell#v1.1.0
    symlink://../TinyShell
    https://github.com/AlisonTristao/TinyEKF
    https://github.com/AlisonTristao/ICM42688_ESPIDF

lib_extra_dirs = utils

; managed_components/ is gitignored and owned by the ESP-IDF component
; manager, which can silently re-fetch a pristine espressif/esp_tinyusb and
; drop our local fixes. Re-apply them before every build.
;
; ICM42688_ESPIDF has no version pin and upstream master never grew the
; busOpen()/scanBus()/public-whoAmI() API utils/BallyRobot/BallyRobot.cpp's
; "scan_i2c"/"test_i2c" DEBUG commands already call -- same situation,
; re-applied the same way.
extra_scripts =
    pre:scripts/patch_esp_tinyusb.py
    pre:scripts/patch_icm42688.py
    ; The channel/key contract has to hold for the firmware that SHIPS, not
    ; just for the host test run -- a robot flashed from a drifted
    ; bally_channels.h disagrees with the dongle about which key opens which
    ; channel, and the symptom is a link that simply never comes up.
    pre:scripts/check_channel_contract.py

build_flags =
    -I robot
    -I include
    -I utils
    -D LOG_ALL
    -std=gnu++2a
    -fexceptions
    -O3
    -funroll-loops
    -D MAC_ADDR=0xDC,0xDA,0x0C,0x30,0xAA,0x5C
    -D BAUDRATE=5000000
    -Wno-format-truncation
    -Wno-overloaded-virtuals

;upload_flags = 
;    --no-stub

build_unflags = 
    -std=gnu++1
    -fno-exceptions;
    -Werror
    -Werror=all

; Host build, for unit tests only -- no firmware is produced here.
;
; test_filter names the suites explicitly instead of picking up everything
; under test/, so a suite is only enabled once it is known to run here.
; test_btp_integration is a one-line shim over test/btp_integration (only a
; directory whose name starts with "test_" is discovered), and it reads
; canonical vectors from ../BTP/test-vectors/v1 relative to the project
; root -- so a sibling checkout of the protocol repo has to be present.
;
; BTP comes from the local checkout (not the pinned tag above) because that is
; the only way a host toolchain can build it. lib/KeyStore uses btp::crc32 to
; validate bally.key, so the same CRC-32/ISO-HDLC routine as the frame
; envelope covers the key file.
[env:native]
platform = native
test_framework = unity
; Keeps a plain `pio run` (all environments, no -e) from trying to compile
; src/ here as firmware -- this environment only exists for `pio test`.
build_src_filter = -<*>
test_build_src = no
test_filter =
    test_keystore
    test_btp_integration
    test_rx_router
    test_manifest_responder
    test_terminal_responder
    test_format
    test_job_scheduler
; "chain+" instead of the default "chain": the dependency finder has to run
; the preprocessor, not just grep for #include, or it would pull lib/SDCard
; (and with it Logger, RobotSettings, OTAUpdater, ...) into the host build
; because of KeyStore.cpp's ESP-IDF-only branch, none of which compiles here.
lib_ldf_mode = chain+
extra_scripts =
    pre:scripts/native_static.py
    pre:scripts/check_channel_contract.py
lib_deps =
    symlink://../BTP
    ; ShellLineEditor (test_terminal_responder) -- same "test THIS working
    ; tree" reasoning as BTP.
    symlink://../TinyShell
build_flags =
    -std=gnu++20
    ; CommandProcessor now classifies replies via bally_channels.h (topico
    ; 31, channel B/key E support) -- that header lives in the project's
    ; include/, which the esp32-s3 env picks up automatically but this env's
    ; test build (build_src_filter = -<*>, no src/ compiled) does not.
    -Iinclude
