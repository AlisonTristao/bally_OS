; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3]
platform                = espressif32
board                   = esp32-s3-devkitc-1
framework               = espidf
monitor_speed           = 921600
upload_speed            = 921600
board_build.f_cpu       = 240000000L
monitor_filters         = esp32_exception_decoder

; OTA — the robot's own OTAUpdater (lib/OTAUpdater) is a plain HTTP server
; (POST /update with the raw .bin body), not the ArduinoOTA/espota wire
; protocol, so upload_protocol must stay "custom" with an explicit curl
; command rather than "espota" (which sends a UDP invitation on :3232 that
; nothing on the robot is listening for — that's the "No response from the
; ESP" espota used to fail with here).
; The password below must match settings.conf's [ota] ota_password on the
; robot (default "657585", see lib/RobotSettings/RobotSettings.h) — this
; file can't read that at upload time, so keep the two in sync by hand.
;upload_protocol         = custom
;upload_port             = ballyrobot.local
;upload_command          = curl -sS --fail --max-time 180 -H "X-OTA-Password: 657585" --data-binary @"$SOURCE" "http://$UPLOAD_PORT/update"

; memory configuration
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = partitions.csv
board_build.arduino.memory_type = qspi_opi

; external libraries
lib_deps =
    https://github.com/AlisonTristao/TinyShell
    https://github.com/AlisonTristao/TinyEKF
    https://github.com/AlisonTristao/ICM42688_ESPIDF

lib_extra_dirs = utils

; managed_components/ is gitignored and owned by the ESP-IDF component
; manager, which can silently re-fetch a pristine espressif/esp_tinyusb and
; drop our local fixes. Re-apply them before every build.
extra_scripts = pre:scripts/patch_esp_tinyusb.py

build_flags =
    -I robot
    -I include
    -I utils
    -D LOG_ALL
    -std=gnu++2a
    -fexceptions
    -O3
    -funroll-loops
    -D MAC_ADDR=0xDC,0xDA,0x0C,0x30,0xAA,0x5C
    -D BAUDRATE=5000000
    ;-D ENABLE_SYSTEM_MONITOR=1
    -Wno-format-truncation
    -Wno-overloaded-virtuals

;upload_flags = 
;    --no-stub

build_unflags = 
    -std=gnu++1
    -fno-exceptions;
    -Werror
    -Werror=all